[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "app"
files = ["app", "tests", "workers"]
